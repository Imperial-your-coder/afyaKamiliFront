<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Afiya Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<style>
:root{--bg:#0d1714;--panel:#15231e;--line:#24382f;--fg:#e9f3ee;--mute:#8aa79a;--acc:#3ee6a8;--warn:#ffb547;--ui:'Sora',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui)}
.app{max-width:480px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:1.15rem;letter-spacing:-.01em}.brand b{color:var(--acc)}
.status{font-family:var(--mono);font-size:.72rem;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}.live .dot{background:var(--acc);box-shadow:0 0 10px var(--acc);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.35}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{font:600 .82rem var(--ui);color:var(--mute);background:none;border:0;border-radius:10px;padding:10px 4px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#06261a}
.cam{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line)}
video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:30% 8%;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.45);transition:inset .3s}
.frame::before{content:"";position:absolute;inset:0;border:2px solid var(--acc);border-radius:14px}
.laser{position:absolute;left:4%;right:4%;top:50%;height:2px;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:s 2s ease-in-out infinite}
@keyframes s{0%,100%{top:15%}50%{top:85%}}
.ocr .frame{inset:42% 5%}.ocr .laser{display:none}
.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:.8rem;color:#fff;text-shadow:0 1px 4px #000}
.cap{position:absolute;right:14px;bottom:44px;left:14px;display:none}
.ocr .cap{display:block}
.btn{width:100%;font:700 1rem var(--ui);padding:14px;border:0;border-radius:14px;background:var(--acc);color:#06261a;cursor:pointer}
.btn:disabled{opacity:.6}.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.manual{display:none;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.manual label{font-size:.8rem;color:var(--mute)}
.manual input{font:700 1.6rem var(--mono);letter-spacing:.12em;text-align:center;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.manual input:focus{outline:2px solid var(--acc);border-color:transparent}
.mode-manual .cam{display:none}.mode-manual .manual{display:flex}
.nudge{display:none;font-size:.82rem;background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.35);color:var(--warn);border-radius:12px;padding:10px 12px}
.nudge button{background:none;border:0;color:var(--warn);font:700 .82rem var(--ui);text-decoration:underline;cursor:pointer;padding:0}
.result{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.code{font:700 1.35rem var(--mono);letter-spacing:.08em;color:var(--acc)}
.src{font-family:var(--mono);font-size:.68rem;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.prod{display:flex;gap:14px;align-items:flex-start}
.prod img{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:12px;flex:none}
.prod h3{margin:0 0 4px;font-size:1.05rem}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.85rem}.meta dt{color:var(--mute)}.meta dd{margin:0}
.empty{color:var(--mute);font-size:.9rem}
</style></head><body>
<div class="app" id="app">
  <header><div class="brand">Afiya <b>Scan</b></div><div class="status" id="st"><span class="dot"></span><span id="stt">prêt</span></div></header>
  <nav class="tabs"><button data-m="bar" class="on">Code-barres</button><button data-m="ocr">Chiffres</button><button data-m="manual">Saisie</button></nav>
  <div class="cam" id="cam">
    <video id="v" playsinline muted autoplay></video>
    <div class="frame"></div><div class="laser"></div>
    <div class="cap"><button class="btn" id="snap">Lire les chiffres</button></div>
    <div class="hint" id="hint">Placez le code-barres dans le cadre</div>
  </div>
  <div class="nudge" id="nudge">Le code-barres n'est pas reconnu ? <button data-m="ocr">Lire les chiffres</button> ou <button data-m="manual">saisir à la main</button>.</div>
  <div class="manual">
    <label for="code">Numéro sous le code-barres</label>
    <input id="code" inputmode="numeric" autocomplete="off" placeholder="6009710390290" maxlength="14">
    <button class="btn" id="ok">Rechercher</button>
  </div>
  <section class="result" id="res"><div class="empty">Aucun produit scanné pour l'instant.</div></section>
</div>
<script>
const $=id=>document.getElementById(id),app=$('app'),cam=$('cam'),v=$('v');
let mode='bar',stream=null,loop=null,busy=false,tStart=0,lastCode='';
const status=(t,live)=>{$('stt').textContent=t;$('st').classList.toggle('live',!!live)};

/* ---- caméra ---- */
async function openCam(){
  if(stream)return true;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
    v.srcObject=stream;await v.play();
    const tr=stream.getVideoTracks()[0];try{await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    return true}
  catch(e){status('caméra refusée');$('hint').textContent='Autorisez la caméra dans Safari';setMode('manual');return false}
}

/* ---- code-barres (ZXing, avec essais en rotation) ---- */
const Z=ZXing,hints=new Map();
hints.set(Z.DecodeHintType.TRY_HARDER,true);
hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.QR_CODE]);
const zr=new Z.MultiFormatReader();zr.setHints(hints);
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
function grab(rot,scale=1){
  const w=v.videoWidth,h=v.videoHeight;if(!w)return null;
  const W=Math.round(w*scale),H=Math.round(h*scale);
  if(rot){cv.width=H;cv.height=W;cx.save();cx.translate(H,0);cx.rotate(Math.PI/2);cx.drawImage(v,0,0,W,H);cx.restore()}
  else{cv.width=W;cv.height=H;cx.drawImage(v,0,0,W,H)}
  return cv}
function tryDecode(c){
  try{const src=new Z.HTMLCanvasElementLuminanceSource(c);
    return zr.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src))).getText()}catch(e){return null}}
let flip=0;
function scanTick(){
  if(busy||!v.videoWidth)return;
  flip++;const c=grab(flip%2===1,v.videoWidth>1280?.6:1);
  const r=c&&tryDecode(c);
  if(r)return found(r,'Code-barres');
  if(Date.now()-tStart>6000)$('nudge').style.display='block';
}

/* ---- OCR des chiffres ---- */
let worker=null;
async function getWorker(){
  if(worker)return worker;
  status('chargement OCR…',true);
  worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status&&m.progress<1)status(m.status.includes('load')?'chargement OCR…':'lecture…',true)}});
  await worker.setParameters({tessedit_char_whitelist:'0123456789',preserve_interword_spaces:'0'});
  return worker}
function eanOk(s){if(!/^\d{8}$|^\d{12,13}$/.test(s))return false;
  const d=s.split('').map(Number),ck=d.pop();let sum=0;
  d.reverse().forEach((n,i)=>sum+=n*(i%2===0?3:1));return (10-sum%10)%10===ck}
function pickCode(txt){
  const runs=txt.split('\n').map(l=>l.replace(/\D/g,'')).filter(r=>r.length>=8);
  for(const r of runs)for(const n of [13,12,8])for(let i=0;i+n<=r.length;i++){const s=r.substr(i,n);if(eanOk(s))return {code:s,sure:true}}
  const best=runs.sort((a,b)=>b.length-a.length)[0];
  return best?{code:best.slice(0,14),sure:false}:null}
/* découpe exactement la zone du cadre affiché, l'agrandit et la passe en noir et blanc */
function cropFrame(thr){
  const W=v.videoWidth,H=v.videoHeight,cr=cam.getBoundingClientRect(),fr=cam.querySelector('.frame').getBoundingClientRect();
  const s=Math.max(cr.width/W,cr.height/H),ox=(W*s-cr.width)/2,oy=(H*s-cr.height)/2;
  let sx=(fr.left-cr.left+ox)/s,sy=(fr.top-cr.top+oy)/s,sw=fr.width/s,sh=fr.height/s;
  const pad=sh*.25;sy=Math.max(0,sy-pad);sh=Math.min(H-sy,sh+2*pad);
  const k=Math.min(3,1600/sw),c=document.createElement('canvas');
  c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';
  x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height),d=im.data;let sum=0;
  for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=g;sum+=g}
  const t=sum/(d.length/4)*thr;
  for(let i=0;i<d.length;i+=4){const g=d[i]<t?0:255;d[i]=d[i+1]=d[i+2]=g;d[i+3]=255}
  x.putImageData(im,0,0);return c}
async function readDigits(){
  const b=$('snap');b.disabled=true;b.textContent='Lecture…';let raw='';
  try{
    const w=await getWorker();status('lecture des chiffres…',true);
    let hit=null;
    for(const [thr,psm] of [[.8,'6'],[.8,'11'],[.65,'6'],[.95,'11']]){
      await w.setParameters({tessedit_pageseg_mode:psm});
      const {data}=await w.recognize(cropFrame(thr));raw=data.text.trim();
      const r=pickCode(data.text);if(r&&(r.sure||!hit))hit=r;if(hit&&hit.sure)break;
    }
    if(hit){if(hit.sure)found(hit.code,'Chiffres lus');else{setMode('manual');$('code').value=hit.code;status('vérifiez le code');$('hint').textContent=''}}
    else{status('chiffres illisibles');$('hint').textContent='Rapprochez-vous : les chiffres doivent remplir le cadre'}
  }catch(e){status('OCR indisponible');$('hint').textContent='Erreur OCR : '+(e.message||e)}
  b.disabled=false;b.textContent='Lire les chiffres';
}

/* ---- résultat ---- */
async function found(code,src){
  if(busy)return;busy=true;lastCode=code;
  if(navigator.vibrate)navigator.vibrate(80);
  status('trouvé',false);
  const res=$('res');
  res.innerHTML=`<div class="src">${src}</div><div class="code">${code}</div><div class="empty">Recherche du produit…</div>`;
  try{
    const d=await(await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json')).json();
    if(d.status===1){const p=d.product;
      res.innerHTML=`<div class="src">${src}</div><div class="code">${code}</div>
      <div class="prod">${p.image_front_small_url?`<img src="${p.image_front_small_url}" alt="">`:''}
      <div><h3>${p.product_name||'Produit sans nom'}</h3>
      <dl class="meta"><dt>Marque</dt><dd>${p.brands||'–'}</dd><dt>Quantité</dt><dd>${p.quantity||'–'}</dd>
      <dt>Nutri-Score</dt><dd>${(p.nutriscore_grade||'–').toUpperCase()}</dd><dt>Origine</dt><dd>${p.countries||'–'}</dd></dl></div></div>`}
    else res.innerHTML=`<div class="src">${src}</div><div class="code">${code}</div><div class="empty">Code lu, mais ce produit n'est pas dans la base Open Food Facts.</div>`;
  }catch(e){res.lastElementChild.textContent='Code lu. Recherche impossible : vérifiez la connexion.'}
  setTimeout(()=>{busy=false;tStart=Date.now();if(mode==='bar')status('scan en cours',true)},2500);
}

/* ---- modes ---- */
async function setMode(m){
  mode=m;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  app.classList.toggle('mode-manual',m==='manual');cam.classList.toggle('ocr',m==='ocr');
  $('nudge').style.display='none';clearInterval(loop);
  if(m==='manual'){status('saisie manuelle');$('code').focus();return}
  if(!(await openCam()))return;
  if(m==='bar'){$('hint').textContent='Placez le code-barres dans le cadre';status('scan en cours',true);tStart=Date.now();loop=setInterval(scanTick,180)}
  else{$('hint').textContent='Cadrez la ligne de chiffres';status('mode chiffres');getWorker().then(()=>status('mode chiffres')).catch(()=>{})}
}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$('snap').onclick=readDigits;
$('ok').onclick=()=>{const c=$('code').value.replace(/\D/g,'');if(c.length>=6){busy=false;found(c,'Saisie manuelle')}};
$('code').onkeydown=e=>{if(e.key==='Enter')$('ok').click()};
setMode('bar');
</script></body></html>
