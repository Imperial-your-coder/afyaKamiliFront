<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Afiya Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<style>
:root{--bg:#0d1714;--panel:#15231e;--line:#24382f;--fg:#e9f3ee;--mute:#8aa79a;--acc:#3ee6a8;--warn:#ffb547;--ui:'Sora',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui)}
.app{max-width:480px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:1.15rem;letter-spacing:-.01em}.brand b{color:var(--acc)}
.status{font-family:var(--mono);font-size:.72rem;color:var(--mute);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}.live .dot{background:var(--acc);box-shadow:0 0 10px var(--acc);animation:p 1.4s infinite}
@keyframes p{50%{opacity:.35}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{font:600 .82rem var(--ui);color:var(--mute);background:none;border:0;border-radius:10px;padding:10px 4px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#06261a}
.cam{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line)}
video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:30% 8%;border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.45);transition:inset .3s}
.frame::before{content:"";position:absolute;inset:0;border:2px solid var(--acc);border-radius:14px}
.laser{position:absolute;left:4%;right:4%;top:50%;height:2px;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:s 2s ease-in-out infinite}
@keyframes s{0%,100%{top:15%}50%{top:85%}}
.ocr .frame{inset:42% 5%}.ocr .laser{display:none}
.hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:.8rem;color:#fff;text-shadow:0 1px 4px #000}
.cap{position:absolute;right:14px;bottom:44px;left:14px;display:none}
.ocr .cap{display:block}
.btn{width:100%;font:700 1rem var(--ui);padding:14px;border:0;border-radius:14px;background:var(--acc);color:#06261a;cursor:pointer}
.btn:disabled{opacity:.6}.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.manual{display:none;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}
.manual label{font-size:.8rem;color:var(--mute)}
.manual input{font:700 1.6rem var(--mono);letter-spacing:.12em;text-align:center;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.manual input:focus{outline:2px solid var(--acc);border-color:transparent}
.mode-manual .cam{display:none}.mode-manual .manual{display:flex}
.nudge{display:none;font-size:.82rem;background:rgba(255,181,71,.12);border:1px solid rgba(255,181,71,.35);color:var(--warn);border-radius:12px;padding:10px 12px}
.nudge button{background:none;border:0;color:var(--warn);font:700 .82rem var(--ui);text-decoration:underline;cursor:pointer;padding:0}
.result{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.code{font:700 1.35rem var(--mono);letter-spacing:.08em;color:var(--acc)}
.src{font-family:var(--mono);font-size:.68rem;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.prod{display:flex;gap:14px;align-items:flex-start}
.prod img{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:12px;flex:none}
.prod h3{margin:0 0 4px;font-size:1.05rem}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.85rem}.meta dt{color:var(--mute)}.meta dd{margin:0}
.empty{color:var(--mute);font-size:.9rem}
.result .btn{margin-top:4px}.result .nudge{margin:0}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(3,10,8,.7);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:18px max(18px,env(safe-area-inset-right)) 8px max(18px,env(safe-area-inset-left))}
.sh-head h2{margin:0;font-size:1.15rem}.x{background:var(--bg);border:1px solid var(--line);color:var(--fg);width:36px;height:36px;border-radius:50%;font-size:1.3rem;cursor:pointer}
.sh-body{overflow-y:auto;padding:0 max(18px,env(safe-area-inset-right)) 8px max(18px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:16px}
.sub{margin:0;color:var(--mute);font-size:.82rem;font-family:var(--mono)}
fieldset{border:0;padding:0;margin:0}legend{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--mute);min-width:0}
.grid label.wide,.grid label:first-child{grid-column:1/-1}.grid b{color:var(--warn)}
.grid input,.grid select,.grid textarea{font:500 .95rem var(--ui);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0;font-size:16px}
.grid input:focus,.grid select:focus,.grid textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.grid .missing input,.grid .missing select{border-color:rgba(255,181,71,.6)}
.sh-foot{padding:12px max(18px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));border-top:1px solid var(--line)}
[hidden]{display:none!important}.sh-body{flex:1 1 auto;min-height:0}
.stk{font:700 1rem var(--mono);color:var(--acc)}
.grid>label{grid-column:auto}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
.grid input,.grid select,.grid textarea{display:block;max-width:100%;min-height:44px;line-height:1.3;-webkit-appearance:none;appearance:none}
.grid select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;text-overflow:ellipsis}
.grid input[type=date]{text-align:left}.grid input::-webkit-date-and-time-value{text-align:left}
.grid textarea{resize:vertical}
.prod>div,.meta dd{min-width:0;overflow-wrap:anywhere}
.code{overflow-wrap:anywhere}
.idrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pid{font:700 .78rem var(--mono);background:var(--acc);color:#06261a;padding:4px 8px;border-radius:6px;letter-spacing:.05em}
.unit{border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.uid{font:700 .9rem var(--mono);color:var(--acc)}
.lock{margin:0;font-size:.8rem;color:var(--mute);background:var(--bg);border-radius:10px;padding:10px}
</style></head><body>
<div class="app" id="app">
  <header><div class="brand">Afiya <b>Scan</b></div><div class="status" id="st"><span class="dot"></span><span id="stt">prêt</span></div></header>
  <nav class="tabs"><button data-m="bar" class="on">Code-barres</button><button data-m="ocr">Chiffres</button><button data-m="manual">Saisie</button></nav>
  <div class="cam" id="cam">
    <video id="v" playsinline muted autoplay></video>
    <div class="frame"></div><div class="laser"></div>
    <div class="cap"><button class="btn" id="snap">Lire les chiffres</button></div>
    <div class="hint" id="hint">Placez le code-barres dans le cadre</div>
  </div>
  <div class="nudge" id="nudge">Le code-barres n'est pas reconnu ? <button data-m="ocr">Lire les chiffres</button> ou <button data-m="manual">saisir à la main</button>.</div>
  <div class="manual">
    <label for="code">Numéro sous le code-barres</label>
    <input id="code" inputmode="numeric" autocomplete="off" placeholder="3400930000000" maxlength="14">
    <button class="btn" id="ok">Rechercher</button>
  </div>
  <section class="result" id="res"><div class="empty">Aucun produit scanné pour l'instant.</div></section>
</div>
<div class="sheet" id="sheet" hidden>
  <form class="panel" id="sheetForm" novalidate>
    <div class="sh-head"><h2 id="sheetTitle">Nouveau produit</h2><button type="button" class="x" id="sheetClose" aria-label="Fermer">×</button></div>
    <div class="sh-body" id="sheetBody"></div>
    <div class="sh-foot"><button type="submit" class="btn">Enregistrer la fiche</button></div>
  </form>
</div>
<script>
const $=id=>document.getElementById(id),app=$('app'),cam=$('cam'),v=$('v');
let mode='bar',stream=null,loop=null,busy=false,tStart=0,lastCode='';
const status=(t,live)=>{$('stt').textContent=t;$('st').classList.toggle('live',!!live)};

/* ---- caméra ---- */
async function openCam(){
  if(stream)return true;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}},audio:false});
    v.srcObject=stream;await v.play();
    const tr=stream.getVideoTracks()[0];try{await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    return true}
  catch(e){status('caméra refusée');$('hint').textContent='Autorisez la caméra dans Safari';setMode('manual');return false}
}

/* ---- code-barres (ZXing, avec essais en rotation) ---- */
const Z=ZXing,hints=new Map();
hints.set(Z.DecodeHintType.TRY_HARDER,true);
hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.QR_CODE,Z.BarcodeFormat.DATA_MATRIX]);
const zr=new Z.MultiFormatReader();zr.setHints(hints);
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
function grab(rot,scale=1){
  const w=v.videoWidth,h=v.videoHeight;if(!w)return null;
  const W=Math.round(w*scale),H=Math.round(h*scale);
  if(rot){cv.width=H;cv.height=W;cx.save();cx.translate(H,0);cx.rotate(Math.PI/2);cx.drawImage(v,0,0,W,H);cx.restore()}
  else{cv.width=W;cv.height=H;cx.drawImage(v,0,0,W,H)}
  return cv}
function tryDecode(c){
  try{const src=new Z.HTMLCanvasElementLuminanceSource(c);
    return zr.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src))).getText()}catch(e){return null}}
let flip=0;
function scanTick(){
  if(busy||!v.videoWidth)return;
  flip++;const c=grab(flip%2===1,v.videoWidth>1280?.6:1);
  const r=c&&tryDecode(c);
  if(r)return found(r,'Code-barres');
  if(Date.now()-tStart>6000)$('nudge').style.display='block';
}

/* ---- OCR des chiffres ---- */
let worker=null;
async function getWorker(){
  if(worker)return worker;
  status('chargement OCR…',true);
  worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status&&m.progress<1)status(m.status.includes('load')?'chargement OCR…':'lecture…',true)}});
  await worker.setParameters({tessedit_char_whitelist:'0123456789',preserve_interword_spaces:'0'});
  return worker}
function eanOk(s){if(!/^\d{8}$|^\d{12,13}$/.test(s))return false;
  const d=s.split('').map(Number),ck=d.pop();let sum=0;
  d.reverse().forEach((n,i)=>sum+=n*(i%2===0?3:1));return (10-sum%10)%10===ck}
function pickCode(txt){
  const runs=txt.split('\n').map(l=>l.replace(/\D/g,'')).filter(r=>r.length>=8);
  for(const r of runs)for(const n of [13,12,8])for(let i=0;i+n<=r.length;i++){const s=r.substr(i,n);if(eanOk(s))return {code:s,sure:true}}
  const best=runs.sort((a,b)=>b.length-a.length)[0];
  return best?{code:best.slice(0,14),sure:false}:null}
/* découpe exactement la zone du cadre affiché, l'agrandit et la passe en noir et blanc */
function cropFrame(thr){
  const W=v.videoWidth,H=v.videoHeight,cr=cam.getBoundingClientRect(),fr=cam.querySelector('.frame').getBoundingClientRect();
  const s=Math.max(cr.width/W,cr.height/H),ox=(W*s-cr.width)/2,oy=(H*s-cr.height)/2;
  let sx=(fr.left-cr.left+ox)/s,sy=(fr.top-cr.top+oy)/s,sw=fr.width/s,sh=fr.height/s;
  const pad=sh*.25;sy=Math.max(0,sy-pad);sh=Math.min(H-sy,sh+2*pad);
  const k=Math.min(3,1600/sw),c=document.createElement('canvas');
  c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='high';
  x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height),d=im.data;let sum=0;
  for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=g;sum+=g}
  const t=sum/(d.length/4)*thr;
  for(let i=0;i<d.length;i+=4){const g=d[i]<t?0:255;d[i]=d[i+1]=d[i+2]=g;d[i+3]=255}
  x.putImageData(im,0,0);return c}
async function readDigits(){
  const b=$('snap');b.disabled=true;b.textContent='Lecture…';let raw='';
  try{
    const w=await getWorker();status('lecture des chiffres…',true);
    let hit=null;
    for(const [thr,psm] of [[.8,'6'],[.8,'11'],[.65,'6'],[.95,'11']]){
      await w.setParameters({tessedit_pageseg_mode:psm});
      const {data}=await w.recognize(cropFrame(thr));raw=data.text.trim();
      const r=pickCode(data.text);if(r&&(r.sure||!hit))hit=r;if(hit&&hit.sure)break;
    }
    if(hit){if(hit.sure)found(hit.code,'Chiffres lus');else{setMode('manual');$('code').value=hit.code;status('vérifiez le code');$('hint').textContent=''}}
    else{status('chiffres illisibles');$('hint').textContent='Rapprochez-vous : les chiffres doivent remplir le cadre'}
  }catch(e){status('OCR indisponible');$('hint').textContent='Erreur OCR : '+(e.message||e)}
  b.disabled=false;b.textContent='Lire les chiffres';
}

/* ---- résultat ---- */
const FIELDS=[
 ['Identification',[['name','Nom commercial*','text'],['dci','DCI / principe(s) actif(s)','text'],['dosage','Dosage','text','500 mg'],['form','Forme galénique','list','Comprimé|Comprimé effervescent|Gélule|Sirop|Suspension buvable|Solution injectable|Pommade|Crème|Gel|Collyre|Suppositoire|Ovule|Sachet|Spray|Patch|Lingettes|Autre'],['pack','Conditionnement / contenance','text','Boîte de 20 / 100 ml'],['route','Voie d\'administration','list','Orale|Injectable|Cutanée|Ophtalmique|Nasale|Rectale|Vaginale|Inhalée|Sublinguale|Non applicable'],['lab','Laboratoire / marque','text']]],
 ['Classement',[['cat','Catégorie*','list','Médicament|Parapharmacie|Hygiène|Cosmétique|Nutrition / lait infantile|Complément alimentaire|Dispositif médical|Matériel / consommable'],['thera','Classe thérapeutique','text','Antalgique, antibiotique…'],['rx','Délivrance','list','Libre (sans ordonnance)|Sur ordonnance|Ordonnance spéciale (stupéfiant / psychotrope)'],['amm','N° AMM / enregistrement','text']]],
 ['Lot et stock',[['lot','N° de lot','text'],['exp','Date de péremption*','date'],['min','Seuil d\'alerte stock','number'],['buy','Prix d\'achat (FC)','number'],['sell','Prix de vente (FC)*','number']]],
 ['Usage et sécurité',[['store','Conservation','list','Température ambiante (< 25 °C)|Au frais (2–8 °C)|À l\'abri de la lumière|Congelé'],['posology','Posologie usuelle','area'],['ci','Contre-indications / précautions','area'],['preg','Grossesse / allaitement','list','Autorisé|Avec précaution|Déconseillé|Contre-indiqué'],['notes','Notes','area']]]];
const REQ=['name','cat','exp','sell'];
const VAR=['lot','exp','buy','sell'];            /* propres à chaque article (carton, boîte) */
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem('afiya:'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('afiya:'+k,JSON.stringify(v))}catch(e){}}};
const nextId=k=>{const n=(+store.get('seq:'+k)||0)+1;store.set('seq:'+k,n);return n};
const pad=(n,l)=>String(n).padStart(l,'0');
const fmtDate=d=>d?d.split('-').reverse().join('/'):'';
/* bip */
let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
['touchstart','pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
function beep(ok=true){try{unlockAudio();const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
  o.type='square';o.frequency.value=ok?1850:620;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+(ok?.14:.3));
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.32)}catch(e){}}
let cur=null,unit=null,formMode='new';
const lab=Object.fromEntries(FIELDS.flatMap(g=>g[1]).map(f=>[f[0],f[1].replace('*','')]));
function render(note){
  const p=cur,res=$('res'),miss=REQ.filter(k=>!p[k]);
  const fixed=['dci','dosage','form','pack','route','lab','cat','thera','rx'].filter(k=>p[k]).map(k=>`<dt>${lab[k]}</dt><dd>${esc(p[k])}</dd>`).join('');
  const u=unit?`<div class="unit"><div class="uid">${unit.uid}</div><dl class="meta">${[['Lot',unit.lot],['Péremption',fmtDate(unit.exp)],['Prix de vente',unit.sell&&unit.sell+' FC'],['Entré le',new Date(unit.at).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})]].filter(x=>x[1]).map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join('')}</dl></div>`:'';
  res.innerHTML=`<div class="src">${esc(note||p._src||'')}</div>
  <div class="idrow"><span class="pid">${p.id||'Nouveau'}</span><span class="code">${p.gtin}</span></div>
  <div class="prod">${p.img?`<img src="${esc(p.img)}" alt="">`:''}<div><h3>${esc(p.name||'Produit sans nom')}</h3><dl class="meta"><dt>Pays</dt><dd>${gs1Country(p.gtin)}</dd>${fixed}<dt>Stock</dt><dd class="stk">${p.stock||0}</dd></dl></div></div>
  ${u}
  ${unit?`<button class="btn ghost" id="edit">Modifier lot, péremption ou prix</button>`:miss.length?`<button class="btn" id="edit">Compléter la fiche</button>`:''}`;
  const b=$('edit');if(b)b.onclick=()=>openForm(unit?'unit':'new');
}
function lastUnit(p){return (p.units||[]).slice(-1)[0]||{}}
function addUnit(p,scan){
  const prev=lastUnit(p),n=(p.units||[]).length+1;
  unit={uid:`${p.id}-${pad(n,4)}`,lot:scan.lot||prev.lot||'',exp:scan.exp||prev.exp||'',buy:prev.buy||p.buy||'',sell:prev.sell||p.sell||'',at:Date.now()};
  p.units=[...(p.units||[]),unit];p.stock=p.units.length;store.set(p.gtin,p);}
async function found(code,src){
  if(busy)return;busy=true;lastCode=code;
  if(navigator.vibrate)navigator.vibrate(80);beep();
  status('trouvé',false);unit=null;
  const g=parseGS1(code),gtin=g.gtin||code.replace(/\D/g,'');
  const scan={};if(g.lot)scan.lot=g.lot;if(g.exp)scan.exp=g.exp.split('/').reverse().join('-').replace(/^(\d{4}-\d{2})$/,'$1-01');
  const loc=store.get(gtin);
  if(loc&&!loc.id){loc.id='AK-'+pad(nextId('prod'),5);loc.units=[]}
  if(loc){cur=loc;addUnit(cur,scan);render(`Produit connu · article ajouté au stock`);return release()}
  $('res').innerHTML=`<div class="src">${src}</div><div class="code">${gtin}</div><div class="empty">Recherche du produit…</div>`;
  let p=null;try{p=await lookupDrug(gtin)}catch(e){}
  cur={gtin,...scan,_src:p?'Source : '+p.src:'Absent des bases publiques'};
  if(p){Object.assign(cur,{name:p.name,lab:p.lab,img:p.img});
    if(p.src==='openFDA')Object.assign(cur,{dci:p.active,cat:'Médicament',notes:[p.form,p.route].filter(Boolean).join(' · ')});else cur.pack=p.form}
  if(REQ.every(k=>cur[k])){createProduct();render('Nouveau produit enregistré');release()}
  else{render();openForm('new')}
}
function createProduct(){
  cur.id='AK-'+pad(nextId('prod'),5);const s={lot:cur.lot,exp:cur.exp};
  const {_src,lot,exp,...d}=cur;cur=d;cur.created=Date.now();addUnit(cur,s)}
function release(){setTimeout(()=>{if($('sheet').hidden){busy=false;tStart=Date.now();if(mode==='bar')status('scan en cours',true)}},2500)}
function field([k,l,t,o],src){
  const v=esc(src[k]),id='f_'+k,req=l.endsWith('*')?' required':'';
  let inp;
  if(t==='list')inp=`<select id="${id}"${req}><option value="">—</option>${o.split('|').map(x=>`<option${src[k]===x?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
  else if(t==='area')inp=`<textarea id="${id}" rows="2">${v}</textarea>`;
  else inp=`<input id="${id}" type="${t}" value="${v}"${t==='number'?' inputmode="decimal" min="0"':''}${o?` placeholder="${esc(o)}"`:''}${req}>`;
  return `<label class="${t==='area'?'wide':''}${!src[k]&&req?' missing':''}"><span>${l.replace('*','<b>*</b>')}</span>${inp}</label>`}
function openForm(m){
  formMode=m;busy=true;clearInterval(loop);
  const src=m==='unit'?unit:cur;
  const groups=m==='unit'?[['Cet article · '+unit.uid,FIELDS.flatMap(g=>g[1]).filter(f=>VAR.includes(f[0]))]]:FIELDS;

/* GS1 DataMatrix pharma : (01) GTIN, (17) péremption AAMMJJ, (10) lot, (21) série */
function parseGS1(s){
  s=s.replace(/^\]d2/,'').replace(/\(([0-9]{2})\)/g,'\x1d$1').replace(/^\x1d/,'');
  if(!/^01\d{14}/.test(s))return {};
  const o={};let i=0;const GS='\x1d';
  while(i<s.length){if(s[i]===GS){i++;continue}
    const ai=s.substr(i,2);i+=2;
    if(ai==='01'){o.gtin=s.substr(i,14).replace(/^0/,'');i+=14}
    else if(ai==='17'){const d=s.substr(i,6);o.exp=(d.slice(4)==='00'?'':d.slice(4)+'/')+d.slice(2,4)+'/20'+d.slice(0,2);i+=6}
    else{let j=s.indexOf(GS,i);if(j<0)j=s.length;const val=s.slice(i,j);if(ai==='10')o.lot=val;if(ai==='21')o.sn=val;i=j}}
  return o}

  const f=T.find(([a,b])=>p>=a&&p<=b);return f?f[2]:'Préfixe '+String(p).padStart(3,'0')}
/* openFDA : médicaments enregistrés aux États-Unis (recherche par code UPC) */
async function lookupDrug(g){
  const q=[g,g.padStart(12,'0').slice(-12)];
  for(const c of [...new Set(q)]){
    const r=await fetch('https://api.fda.gov/drug/label.json?search=openfda.upc:%22'+c+'%22&limit=1');
    if(!r.ok)continue;const d=await r.json(),f=(d.results&&d.results[0]||{}).openfda;
    if(f)return {name:(f.brand_name||f.generic_name||['Médicament'])[0],lab:(f.manufacturer_name||[])[0],form:(f.dosage_form||[])[0],route:(f.route||[])[0],active:(f.substance_name||f.generic_name||[]).join(', '),src:'openFDA'}}
  /* parapharmacie, hygiène, cosmétique, nutrition : bases Open*Facts */
  for(const [host,src] of [['world.openbeautyfacts.org','Open Beauty Facts'],['world.openfoodfacts.org','Open Food Facts'],['world.openproductsfacts.org','Open Products Facts']]){
    try{const d=await(await fetch('https://'+host+'/api/v2/product/'+g+'.json')).json();
      if(d.status===1){const p=d.product;return {name:p.product_name_fr||p.product_name||'Produit sans nom',lab:p.brands,form:p.quantity,active:(p.categories||'').split(',').slice(-1)[0].trim(),img:p.image_front_small_url,src}}}catch(e){}}
  return null}

/* ---- modes ---- */
async function setMode(m){
  mode=m;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  app.classList.toggle('mode-manual',m==='manual');cam.classList.toggle('ocr',m==='ocr');
  $('nudge').style.display='none';clearInterval(loop);
  if(m==='manual'){status('saisie manuelle');$('code').focus();return}
  if(!(await openCam()))return;
  if(m==='bar'){$('hint').textContent='Placez le code-barres dans le cadre';status('scan en cours',true);tStart=Date.now();loop=setInterval(scanTick,180)}
  else{$('hint').textContent='Cadrez la ligne de chiffres';status('mode chiffres');getWorker().then(()=>status('mode chiffres')).catch(()=>{})}
}
